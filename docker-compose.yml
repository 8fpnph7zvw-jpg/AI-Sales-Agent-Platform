name: ${COMPOSE_PROJECT_NAME:-ai-sales-agent}

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  API_PREFIX: /api/v1
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  JWT_ISSUER: ${JWT_ISSUER:-ai-sales-agent-platform}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-sales-agent-api}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  DIFY_API_BASE_URL: ${DIFY_API_BASE_URL:-https://api.dify.ai/v1}
  DIFY_API_KEY: ${DIFY_API_KEY:-}
  DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-30}
  OPENWA_URL: ${OPENWA_URL:-http://openwa:2785/api}
  OPENWA_API_KEY: ${OPENWA_API_KEY:-}
  OPENWA_SESSION: ${OPENWA_SESSION:-}
  OPENWA_SESSION_NAME: ${OPENWA_SESSION_NAME:-ai-sales-agent}
  WHATSAPP_GRAPH_API_BASE_URL: ${WHATSAPP_GRAPH_API_BASE_URL:-https://graph.facebook.com}
  WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
  WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-15}
  WHATSAPP_PROCESSING_TIMEOUT_SECONDS: ${WHATSAPP_PROCESSING_TIMEOUT_SECONDS:-60}
  WHATSAPP_WEBHOOK_MAX_BYTES: ${WHATSAPP_WEBHOOK_MAX_BYTES:-1048576}
  CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY in .env}
  CONFIG_ENCRYPTION_KEY_VERSION: ${CONFIG_ENCRYPTION_KEY_VERSION:-v1}
  CHROMA_URL: ${CHROMA_URL:-http://chroma:8000}
  CHROMA_COLLECTION: ${CHROMA_COLLECTION:-ai_sales_knowledge}
  CHROMA_ENABLED: ${CHROMA_ENABLED:-true}
  RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-384}
  RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
  RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
  RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-20971520}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@2026}

x-service-hardening: &service-hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  mysql:
    <<: *service-hardening
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_sales_agent}
      MYSQL_USER: ${MYSQL_USER:-ai_sales_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - data_net

  redis:
    <<: *service-hardening
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli --no-auth-warning ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data_net

  chroma:
    <<: *service-hardening
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - data_net

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-sales-agent-backend:${IMAGE_TAG:-local}
    environment: *backend-environment
    command:
      [
        "sh",
        "-c",
        "alembic -c alembic.ini upgrade head && python scripts/initialize_demo.py",
      ]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - data_net

  backend:
    <<: *service-hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-sales-agent-backend:${IMAGE_TAG:-local}
    init: true
    environment: *backend-environment
    command:
      - sh
      - -c
      - |
        export OPENWA_API_KEY="$$(cat /run/openwa/openwa_api_key)"
        export OPENWA_SESSION="$$(cat /run/openwa/openwa_session)"
        exec uvicorn app.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --workers "${BACKEND_WORKERS:-2}" \
          --proxy-headers \
          --forwarded-allow-ips=*
    depends_on:
      migration:
        condition: service_completed_successfully
      openwa:
        condition: service_healthy
      openwa-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - openwa_runtime:/run/openwa:ro
    networks:
      - edge_net
      - data_net
      - connector_net

  openwa:
    <<: *service-hardening
    build:
      context: ./services/openwa
      dockerfile: Dockerfile
    image: ai-sales-agent-openwa:${OPENWA_IMAGE_TAG:-local}
    init: true
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      PORT: 2785
      API_MASTER_KEY: ${OPENWA_API_KEY:-}
      AUTO_START_SESSIONS: ${OPENWA_AUTO_START_SESSIONS:-true}
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-whatsapp-web.js}
      DATABASE_TYPE: sqlite
      DATABASE_NAME: /app/data/openwa.sqlite
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      SESSION_DATA_PATH: /app/data/sessions
      PUPPETEER_HEADLESS: "true"
      REDIS_ENABLED: "false"
      SSRF_ALLOWED_HOSTS: backend
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2785}:2785"
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2785/api/health/ready',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - connector_net

  openwa-init:
    image: ai-sales-agent-openwa:${OPENWA_IMAGE_TAG:-local}
    entrypoint: ["/bin/sh", "/scripts/init-openwa.sh"]
    environment:
      OPENWA_BASE_URL: http://openwa:2785/api
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION: ${OPENWA_SESSION:-}
      OPENWA_SESSION_NAME: ${OPENWA_SESSION_NAME:-ai-sales-agent}
      OPENWA_WEBHOOK_URL: http://backend:8000/api/v1/webhooks/whatsapp
      OPENWA_INIT_TIMEOUT_SECONDS: ${OPENWA_INIT_TIMEOUT_SECONDS:-180}
      BACKEND_UID: 10001
      BACKEND_GID: 10001
    depends_on:
      openwa:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - openwa_data:/openwa-data:ro
      - openwa_runtime:/runtime
      - ./scripts/init-openwa.sh:/scripts/init-openwa.sh:ro
      - ./:/workspace
    networks:
      - connector_net

  frontend:
    <<: *service-hardening
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: ai-sales-agent-frontend:${IMAGE_TAG:-local}
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - edge_net

  nginx:
    <<: *service-hardening
    image: nginx:1.27-alpine
    init: true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - edge_net

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  openwa_data:
  openwa_runtime:

networks:
  edge_net:
  connector_net:
  data_net:
    internal: true
