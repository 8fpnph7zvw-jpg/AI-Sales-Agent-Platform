user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 16;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name liuxioazhen.top www.liuxioazhen.top;

        return 301 https://$host$request_uri;
    }
server {
        listen 80;

        server_name demo.liuxioazhen.top;

        root /var/www/AI-Sales-Agent-Demo;

        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /demo.mp4 {
            alias /var/www/AI-Sales-Agent-Demo/public/demo.mp4;
        }
    }
    server {
        listen 443 ssl;
        http2 on;
        server_name liuxioazhen.top www.liuxioazhen.top;

        ssl_certificate /etc/letsencrypt/live/liuxioazhen.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/liuxioazhen.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location ^~ /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_pass http://backend_upstream;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_pass http://frontend_upstream;
        }
    }

    server {
        listen 80;
        server_name m.liuxioazhen.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name m.liuxioazhen.top;

        ssl_certificate /etc/letsencrypt/live/m.liuxioazhen.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/m.liuxioazhen.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:MTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        root /var/www/AI-Sales-Agent-Demo/mobile;
        index index.html;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location ^~ /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            proxy_pass http://backend_upstream;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

}
