[build-system]
requires = ["hatchling>=1.25,<2.0", "editables>=0.5,<1.0"]
build-backend = "hatchling.build"

[project]
name = "ai-sales-agent-api"
version = "0.1.0"
description = "Enterprise AI Sales Agent Platform API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncmy>=0.2.10,<1.0",
  "pymysql>=1.1,<2.0",
  "cryptography>=43,<46",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=25.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
